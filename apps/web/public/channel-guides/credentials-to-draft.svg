<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">从官方控制台取值，填入本页专用表单</title><desc id="desc">不在示意图填写真实值；不要把任何密钥放入聊天、人设、截图或浏览器持久存储</desc>
<rect width="960" height="540" rx="16" fill="#f8fafc"/>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif">
<text x="32" y="44" font-size="25" font-weight="600" fill="#1d2939">从官方控制台取值，填入本页专用表单</text>
<text x="32" y="76" font-size="14" fill="#53616b">不在示意图填写真实值；不要把任何密钥放入聊天、人设、截图或浏览器持久存储</text>
<rect x="32" y="105" width="438" height="190" rx="12" fill="white" stroke="#167060" stroke-width="1.5"/>
<rect x="32" y="105" width="6" height="190" rx="3" fill="#167060"/>
<text x="52" y="139" font-size="19" font-weight="600" fill="#1d2939">飞书 / 钉钉</text>
<text x="52" y="170" font-size="15" fill="#344054">飞书：App ID + App Secret</text>
<text x="52" y="197" font-size="15" fill="#344054">钉钉：Client ID + Client Secret</text>
<text x="52" y="224" font-size="15" fill="#344054">复制同一应用的两项凭据</text>
<text x="52" y="251" font-size="15" fill="#344054">点击「验证渠道并读取通讯录」</text>
<rect x="490" y="105" width="438" height="190" rx="12" fill="white" stroke="#167060" stroke-width="1.5"/>
<rect x="490" y="105" width="6" height="190" rx="3" fill="#167060"/>
<text x="510" y="139" font-size="19" font-weight="600" fill="#1d2939">企业微信：分别填写两套凭据</text>
<text x="510" y="170" font-size="15" fill="#344054">智能机器人：Bot ID + Secret</text>
<text x="510" y="197" font-size="15" fill="#344054">目录：复用本 WS 应用，或填写</text>
<text x="510" y="224" font-size="15" fill="#344054">Corp ID + Agent ID + 目录应用 Secret</text>
<text x="510" y="251" font-size="15" fill="#344054">核对并勾选「属于同一企业」</text>
<rect x="32" y="315" width="896" height="150" rx="12" fill="white" stroke="#c08722" stroke-width="1.5"/>
<rect x="32" y="315" width="6" height="150" rx="3" fill="#c08722"/>
<text x="52" y="349" font-size="19" font-weight="600" fill="#1d2939">此时仅创建短期验证草稿</text>
<text x="52" y="380" font-size="15" fill="#344054">修改字段或切换 Tab → 旧验证与目录授权失效 → 重新验证</text>
<text x="52" y="407" font-size="15" fill="#344054">最后「确认创建」→ 员工 / 模型 / 渠道 / 能力包授权一起正式保存</text>
<text x="52" y="434" font-size="15" fill="#344054">提交后才启动长连接；连接上线和真实收发验证分别展示</text>
<text x="32" y="498" font-size="14" fill="#53616b">临时草稿有期限，取消不留下正式员工、连接或新模型记录。</text>
<text x="32" y="523" font-size="12" fill="#687780">identity 原创操作示意 · 非官方控制台截图 · 核对日期 2026-10-24</text>
</g></svg>
