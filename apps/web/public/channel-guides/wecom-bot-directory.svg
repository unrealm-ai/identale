<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">企业微信：机器人与通讯录是两套配置</title><desc id="desc">位置：智能机器人 API / 长连接；管理后台 → 应用管理 → 传统自建应用</desc>
<rect width="960" height="540" rx="16" fill="#f8fafc"/>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif">
<text x="32" y="44" font-size="25" font-weight="600" fill="#1d2939">企业微信：机器人与通讯录是两套配置</text>
<text x="32" y="76" font-size="14" fill="#53616b">位置：智能机器人 API / 长连接；管理后台 → 应用管理 → 传统自建应用</text>
<rect x="32" y="105" width="438" height="220" rx="12" fill="white" stroke="#167060" stroke-width="1.5"/>
<rect x="32" y="105" width="6" height="220" rx="3" fill="#167060"/>
<text x="52" y="139" font-size="19" font-weight="600" fill="#1d2939">每员工独立：智能机器人</text>
<text x="52" y="170" font-size="15" fill="#344054">Bot ID</text>
<text x="52" y="197" font-size="15" fill="#344054">机器人 Secret</text>
<text x="52" y="224" font-size="15" fill="#344054">官方 SDK 主动 WebSocket 收发</text>
<text x="52" y="251" font-size="15" fill="#344054">不使用群 Webhook / 公网回调 URL</text>
<text x="52" y="278" font-size="15" fill="#344054">最后创建后完成机器人入站身份验证</text>
<rect x="490" y="105" width="438" height="220" rx="12" fill="white" stroke="#167060" stroke-width="1.5"/>
<rect x="490" y="105" width="6" height="220" rx="3" fill="#167060"/>
<text x="510" y="139" font-size="19" font-weight="600" fill="#1d2939">同 WS 可复用：目录应用</text>
<text x="510" y="170" font-size="15" fill="#344054">Corp ID + 数字 Agent ID</text>
<text x="510" y="197" font-size="15" fill="#344054">传统自建应用 Secret（不是机器人 Secret）</text>
<text x="510" y="224" font-size="15" fill="#344054">限定可见部门 / 人员及必要只读权限</text>
<text x="510" y="251" font-size="15" fill="#344054">可信 IP 按企业控制台当前要求配置</text>
<text x="510" y="278" font-size="15" fill="#344054">仅动态查询，不全量导入组织</text>
<rect x="32" y="345" width="896" height="120" rx="12" fill="white" stroke="#c08722" stroke-width="1.5"/>
<rect x="32" y="345" width="6" height="120" rx="3" fill="#c08722"/>
<text x="52" y="379" font-size="19" font-weight="600" fill="#1d2939">核对同企业 → 临时验证目录 → 最后统一保存</text>
<text x="52" y="410" font-size="15" fill="#344054">同企业关联是管理员声明，不是厂商证明；Bot Secret 与目录 AppSecret 不可混用</text>
<text x="52" y="437" font-size="15" fill="#344054">当前不支持群历史、话题历史或会议材料，不为这些功能申请额外权限</text>
<text x="32" y="498" font-size="14" fill="#53616b">目录验证成功 ≠ 机器人入站已验证 ≠ 实际收发成功。</text>
<text x="32" y="523" font-size="12" fill="#687780">identity 原创操作示意 · 非官方控制台截图 · 核对日期 2026-10-24</text>
</g></svg>
