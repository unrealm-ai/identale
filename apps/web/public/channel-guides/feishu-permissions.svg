<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
<title id="title">飞书：基础权限与可选能力分开配置</title><desc id="desc">位置：应用 → 权限管理 / 通讯录权限范围；菜单以当前官方控制台为准</desc>
<rect width="960" height="540" rx="16" fill="#f8fafc"/>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif">
<text x="32" y="44" font-size="25" font-weight="600" fill="#1d2939">飞书：基础权限与可选能力分开配置</text>
<text x="32" y="76" font-size="14" fill="#53616b">位置：应用 → 权限管理 / 通讯录权限范围；菜单以当前官方控制台为准</text>
<rect x="32" y="105" width="438" height="220" rx="12" fill="white" stroke="#167060" stroke-width="1.5"/>
<rect x="32" y="105" width="6" height="220" rx="3" fill="#167060"/>
<text x="52" y="139" font-size="19" font-weight="600" fill="#1d2939">消息基础：按使用场景选择</text>
<text x="52" y="170" font-size="15" fill="#344054">发送：im:message:send_as_bot</text>
<text x="52" y="197" font-size="15" fill="#344054">群 @：im:message.group_at_msg:readonly</text>
<text x="52" y="224" font-size="15" fill="#344054">私聊：im:message.p2p_msg:readonly</text>
<text x="52" y="251" font-size="15" fill="#344054">事件：im.message.receive_v1</text>
<text x="52" y="278" font-size="15" fill="#344054">最终创建、连接在线后再保存长连接订阅</text>
<rect x="490" y="105" width="438" height="220" rx="12" fill="white" stroke="#167060" stroke-width="1.5"/>
<rect x="490" y="105" width="6" height="220" rx="3" fill="#167060"/>
<text x="510" y="139" font-size="19" font-weight="600" fill="#1d2939">目录只读：用于选择使用者</text>
<text x="510" y="170" font-size="15" fill="#344054">读取应用通讯录权限范围</text>
<text x="510" y="197" font-size="15" fill="#344054">读取用户基本信息、部门与部门成员</text>
<text x="510" y="224" font-size="15" fill="#344054">仅授权需要的人员 / 部门</text>
<text x="510" y="251" font-size="15" fill="#344054">管理员审批、发布并确认生效</text>
<text x="510" y="278" font-size="15" fill="#344054">不要求写权限或无关敏感字段</text>
<rect x="32" y="345" width="896" height="120" rx="12" fill="white" stroke="#c08722" stroke-width="1.5"/>
<rect x="32" y="345" width="6" height="120" rx="3" fill="#c08722"/>
<text x="52" y="379" font-size="19" font-weight="600" fill="#1d2939">可选：另行申请，不作为基础接入前置条件</text>
<text x="52" y="410" font-size="15" fill="#344054">普通群上下文 / 历史：额外消息权限与目标群范围</text>
<text x="52" y="437" font-size="15" fill="#344054">会后材料：实际生成的 Minutes、访问 / 导出权限、明确 token</text>
<text x="32" y="498" font-size="14" fill="#53616b">应用可用范围与通讯录数据授权分别核对；不一次申请全部权限。</text>
<text x="32" y="523" font-size="12" fill="#687780">identity 原创操作示意 · 非官方控制台截图 · 核对日期 2026-10-24</text>
</g></svg>
